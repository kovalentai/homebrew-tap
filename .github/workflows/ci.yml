name: CI

# Every change to the formula is style-checked, audited, installed, and run.
# The audit is --online, so it also catches a formula whose artifacts are not
# actually reachable.

on:
  push:
    branches: [main]
  pull_request:
  # A formula can rot without anyone touching it: the CLI publishes a new
  # version, or an artifact moves. Catch that on a schedule instead of on a
  # user's machine.
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon and macos-15-intel is Intel, so both macOS
        # branches of the formula get exercised rather than just the one the
        # default runner happens to be. Pinned to one macOS version, so the
        # pair moves together.
        #
        # This was macos-14 until that image was retired. A label GitHub no
        # longer serves does not fail: the job is cancelled in the same second
        # it starts, with no runner, no steps and no annotation, and the run
        # goes green around it. Every on_arm install went unchecked for three
        # runs before anyone noticed.
        os: [macos-15, macos-15-intel, ubuntu-latest]
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - uses: actions/checkout@v4
        with:
          path: tap

      # setup-homebrew notices this repo is a tap and checks its own copy into
      # the Taps directory. Replace it outright, so brew reads the commit under
      # test rather than whatever was fetched.
      - name: Install as a tap
        run: |
          set -euo pipefail
          TAP_DIR="$(brew --repository)/Library/Taps/kovalentai/homebrew-tap"
          rm -rf "$TAP_DIR"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -s "$GITHUB_WORKSPACE/tap" "$TAP_DIR"
          brew tap-info kovalentai/tap

      # The formula is checked by brew below; this is the other half of the repo,
      # the script the bump workflow renders it with. Run on every OS in the
      # matrix because it is a bash script, and macOS still ships bash 3.2.
      - name: Render script tests
        working-directory: tap
        run: tests/render-formula.test.sh

      - name: Style
        run: brew style kovalentai/tap

      - name: Audit
        run: brew audit --strict --online kovalentai/tap/knaix

      - name: Install
        run: brew install --verbose kovalentai/tap/knaix

      - name: Test
        run: brew test --verbose kovalentai/tap/knaix

      - name: Completions are on disk
        run: |
          set -euo pipefail
          prefix="$(brew --prefix knaix)"
          test -s "$prefix/etc/bash_completion.d/knaix"
          test -s "$prefix/share/zsh/site-functions/_knaix"
          test -s "$prefix/share/fish/vendor_completions.d/knaix.fish"

      # Stands in for a livecheck block, which brew style will not accept on a
      # formula with no top-level url. On the schedule this is the whole point
      # of the run: it goes red when a CLI release has shipped and the bump
      # never landed, rather than leaving the tap quietly a version behind.
      - name: Formula is not behind the published release
        run: |
          set -euo pipefail
          formula="$(brew info --json=v2 kovalentai/tap/knaix | jq -r '.formulae[0].versions.stable')"
          latest="$(curl -fsSL https://releases.knaix.com/latest-version | tr -d '[:space:]')"
          echo "formula=$formula latest=$latest"
          if [ "$formula" != "$latest" ]; then
            echo "::error::Formula is at $formula but releases.knaix.com serves $latest. Run the Bump the formula workflow in this repository."
            exit 1
          fi

  # Coverage of scripts/render-formula.sh, measured once, on Linux, the way the
  # bump workflow runs it. tests/coverage.sh holds the floor, so the number is
  # enforced the same way here and on a laptop.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install bashcov
        run: gem install --no-document bashcov -v 4.0.2

      - name: Tests, measuring coverage
        run: tests/coverage.sh

      # Rounded down, so the badge never claims more than was measured.
      - name: Coverage badge
        run: |
          set -euo pipefail
          jq '.total.lines.percent as $p | {schemaVersion: 1, label: "coverage",
              message: "\($p | floor)%",
              color: (if $p < 60 then "red" elif $p < 80 then "yellow" else "brightgreen" end)}' \
            coverage/coverage.json > badge.json
          cat badge.json

      - name: Keep the badge for publishing
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: badge.json

  # Publishes the badge the README shows, from main only. Its own job, so the
  # test jobs' token stays read-only, and allowed to fail, since a badge that
  # did not update is no reason to mark main red.
  coverage-badge:
    name: Publish the coverage badge
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: new

      # An orphan branch that holds only the badge, committed to only when the
      # number changed.
      - name: Commit it to the badges branch
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q badges && cd badges
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin badges; then
            git checkout -q -B badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          cp ../new/badge.json coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged: $(jq -r .message coverage.json)"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "coverage: $(jq -r .message coverage.json)"
          git push -q origin HEAD:badges
